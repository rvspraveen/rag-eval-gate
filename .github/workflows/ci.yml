name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CONTINUOUS_EVAL_DO_NOT_TRACK: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # continuous-eval 0.3.14.post2 declares requires-python <3.13 (see LIMITATIONS.md).
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -U pip setuptools
      - run: python -m pip install -e ".[dev]"
      - run: reg setup
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (coverage gate 90%)
        run: pytest
      - name: Security scan (bandit)
        run: bandit -q -r src
      - name: Dependency audit (pip-audit)
        # Audit once, on 3.12: filelock (audit tooling, not a runtime dependency) has fixes only for Python >=3.11.
        if: matrix.python-version == '3.12'
        # GHSA-xf7x-x43h-rpqh (json-repair, pinned <0.32 by continuous-eval) needs a caller-supplied
        # JSON schema; continuous-eval never passes one. See SECURITY.md. Remove once upstream lifts the cap.
        run: pip-audit --skip-editable --ignore-vuln GHSA-xf7x-x43h-rpqh

  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - run: reg setup
      - name: Samples are reproducible
        run: |
          python examples/make_samples.py
          git diff --exit-code examples/
      - name: README output is real and current
        run: |
          python scripts/build_readme.py
          git diff --exit-code README.md
      - name: Healthy run passes against the baseline
        run: reg gate -d examples/dataset.jsonl -r examples/good_run.jsonl -b examples/baseline.json -g examples/gate.yaml
      - name: Regressed run must fail with exit 1
        run: |
          set +e
          reg gate -d examples/dataset.jsonl -r examples/regressed_run.jsonl -b examples/baseline.json -g examples/gate.yaml -f markdown -o regressed.md
          code=$?
          cat regressed.md >> "$GITHUB_STEP_SUMMARY"
          test "$code" -eq 1

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Action passes on the healthy run
        uses: ./
        with:
          dataset: examples/dataset.jsonl
          run: examples/good_run.jsonl
          baseline: examples/baseline.json
          gate: examples/gate.yaml
      - name: Action fails on the regressed run
        id: bad
        continue-on-error: true
        uses: ./
        with:
          dataset: examples/dataset.jsonl
          run: examples/regressed_run.jsonl
          baseline: examples/baseline.json
          gate: examples/gate.yaml
      - name: Assert the regressed run failed
        if: steps.bad.outcome != 'failure'
        run: exit 1
