[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "rag-eval-gate"
dynamic = ["version"]
description = "Baseline-aware merge gate for RAG quality, built on continuous-eval."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10,<3.13"
keywords = ["rag", "evaluation", "llm", "ci", "regression-testing", "continuous-eval", "retrieval"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  # Exact pin: the last upstream release (Jan 2025). Upgrades only via a PR that passes the dogfood gate.
  "continuous-eval==0.3.14.post2",
  "numpy>=2.2.6",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "bandit>=1.7", "pip-audit>=2.7"]

[project.scripts]
reg = "reg.cli:main"

[project.urls]
Upstream = "https://github.com/relari-ai/continuous-eval"

[tool.hatch.version]
path = "src/reg/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/reg"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"examples/**" = ["S311", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=reg --cov-report=term-missing --cov-fail-under=90"
filterwarnings = ["ignore::DeprecationWarning"]
