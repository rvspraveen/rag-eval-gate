name: "RAG eval gate"
description: "Block merges when RAG quality regresses against a baseline (built on continuous-eval)."
branding:
  icon: "trending-down"
  color: "orange"
inputs:
  dataset:
    description: "Eval dataset (.jsonl)"
    required: true
  run:
    description: "Your app's outputs for the dataset (.jsonl)"
    required: true
  baseline:
    description: "Baseline scores file promoted with `reg baseline promote`"
    required: true
  gate:
    description: "Gate config (gate.yaml)"
    required: true
  fail-on-warn:
    description: "Treat warn-severity metrics as failures"
    required: false
    default: "false"
  comment:
    description: "Post or update a sticky PR comment with the report. Needs `pull-requests: write` in the calling job."
    required: false
    default: "false"
  python-version:
    description: "Python version to run the gate with (3.10 to 3.12)"
    required: false
    default: "3.12"
outputs:
  report:
    description: "Path to the Markdown report"
    value: ${{ steps.gate.outputs.report }}
  scores:
    description: "Path to the fresh scores JSON (promote it to update the baseline)"
    value: ${{ steps.gate.outputs.scores }}
runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install rag-eval-gate
      shell: bash
      env:
        CONTINUOUS_EVAL_DO_NOT_TRACK: "true"
      run: |
        python -m pip install --disable-pip-version-check -q "${GITHUB_ACTION_PATH}"
        reg setup
    - name: Run gate
      id: gate
      shell: bash
      env:
        CONTINUOUS_EVAL_DO_NOT_TRACK: "true"
        REG_DATASET: ${{ inputs.dataset }}
        REG_RUN: ${{ inputs.run }}
        REG_BASELINE: ${{ inputs.baseline }}
        REG_GATE: ${{ inputs.gate }}
        REG_FAIL_ON_WARN: ${{ inputs.fail-on-warn }}
      run: |
        report="${RUNNER_TEMP}/reg-report.md"
        scores="${RUNNER_TEMP}/reg-scores.json"
        extra=()
        if [ "${REG_FAIL_ON_WARN}" = "true" ]; then extra+=(--fail-on-warn); fi
        set +e
        reg gate -d "${REG_DATASET}" -r "${REG_RUN}" -b "${REG_BASELINE}" -g "${REG_GATE}" \
          -f markdown -o "${report}" --scores-out "${scores}" "${extra[@]}"
        code=$?
        set -e
        echo "report=${report}" >> "${GITHUB_OUTPUT}"
        echo "scores=${scores}" >> "${GITHUB_OUTPUT}"
        echo "code=${code}" >> "${GITHUB_OUTPUT}"
        if [ -f "${report}" ]; then cat "${report}" >> "${GITHUB_STEP_SUMMARY}"; fi
    - name: Sticky PR comment
      if: inputs.comment == 'true' && github.event_name == 'pull_request' && steps.gate.outputs.code != '2'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPORT: ${{ steps.gate.outputs.report }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        marker="<!-- rag-eval-gate -->"
        body="$(printf '%s\n%s' "${marker}" "$(cat "${REPORT}")")"
        id="$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" | head -n1)"
        if [ -n "${id}" ]; then
          gh api -X PATCH "repos/${REPO}/issues/comments/${id}" -f body="${body}" > /dev/null
        else
          gh api -X POST "repos/${REPO}/issues/${PR}/comments" -f body="${body}" > /dev/null
        fi
    - name: Fail if the gate failed
      shell: bash
      env:
        CODE: ${{ steps.gate.outputs.code }}
      run: exit "${CODE}"
